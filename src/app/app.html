<div class="min-h-screen bg-gray-50 text-gray-900 flex flex-col">
  <!-- Minimalist Top Navigation Bar -->
  <header class="sticky top-0 z-30 border-b border-gray-200 bg-white/90 backdrop-blur-md">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3.5 sm:px-6 lg:px-8">
      <div class="flex items-center gap-3">
        <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-gray-900 text-white shadow-sm">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909M3.75 21h16.5A2.25 2.25 0 0 0 22.5 18.75V5.25A2.25 2.25 0 0 0 20.25 3H3.75A2.25 2.25 0 0 0 1.5 5.25v13.5A2.25 2.25 0 0 0 3.75 21Z" />
          </svg>
        </div>
        <div>
          <h1 class="text-sm font-semibold tracking-tight text-gray-900">
            MinIO Image Storage
          </h1>
          <p class="text-xs text-gray-500">Asset Management</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span class="inline-flex items-center gap-1.5 rounded-full border border-gray-200 bg-gray-50 px-3 py-1 text-xs font-medium text-gray-600">
          <span class="h-2 w-2 rounded-full bg-emerald-500"></span>
          Connected
        </span>
      </div>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="mx-auto w-full max-w-7xl flex-1 px-4 py-8 sm:px-6 lg:px-8">
    <div class="grid gap-8 lg:grid-cols-[340px_1fr] items-start">
      <!-- Left Panel: Upload Form -->
      <aside class="lg:sticky lg:top-20">
        <app-image-upload (uploaded)="onUploaded($event)" />
      </aside>

      <!-- Right Main Area: Gallery -->
      <section class="min-w-0">
        <app-image-gallery />
      </section>
    </div>
  </main>

  <!-- Clean Footer -->
  <footer class="mt-auto border-t border-gray-200 bg-white py-4 text-center text-xs text-gray-500">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 flex items-center justify-between">
      <span>MinIO S3 Storage</span>
      <span>Angular Signals</span>
    </div>
  </footer>
</div>
