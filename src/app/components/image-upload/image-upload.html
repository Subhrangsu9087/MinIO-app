<div class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
  <!-- Card Header -->
  <div class="mb-4 flex items-center justify-between">
    <div>
      <h2 class="text-sm font-semibold text-gray-900">Upload Image</h2>
      <p class="text-xs text-gray-500">Add assets to the S3 bucket</p>
    </div>
    <span class="rounded bg-gray-100 px-2 py-0.5 text-[11px] font-medium text-gray-600">
      Direct PUT
    </span>
  </div>

  <!-- Clean Dropzone -->
  <div
    class="relative flex cursor-pointer flex-col items-center justify-center rounded-lg border-2 border-dashed p-6 text-center transition-colors"
    [class.border-blue-500]="isDragging()"
    [class.bg-blue-50]="isDragging()"
    [class.border-gray-300]="!isDragging()"
    [class.bg-gray-50]="!isDragging()"
    [class.hover:border-gray-400]="!isDragging()"
    [class.hover:bg-gray-100]="!isDragging()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <label for="image-input" class="cursor-pointer flex flex-col items-center w-full">
      <div class="mb-3 flex h-10 w-10 items-center justify-center rounded-full bg-white text-gray-500 shadow-sm border border-gray-200">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0 3 3m-3-3-3 3M6.75 19.5a4.5 4.5 0 0 1-1.41-8.775 5.25 5.25 0 0 1 10.233-2.33 3 3 0 0 1 3.758 3.848A3.752 3.752 0 0 1 18 19.5H6.75Z" />
        </svg>
      </div>

      <p class="text-xs font-medium text-gray-700">
        <span class="text-blue-600 hover:underline">Click to upload</span> or drag and drop
      </p>
      <p class="mt-1 text-[11px] text-gray-400">PNG, JPG, WEBP, GIF</p>

      <input
        id="image-input"
        type="file"
        accept="image/*"
        class="sr-only"
        (change)="onFileSelected($event)"
      />
    </label>
  </div>

  <!-- Progress Bar -->
  @if (uploadService.uploading()) {
    <div class="mt-4 rounded-lg border border-gray-200 bg-gray-50 p-3">
      <div class="mb-1.5 flex items-center justify-between text-xs text-gray-600">
        <span class="font-medium">Uploading...</span>
        <span class="font-semibold text-gray-900">{{ uploadService.progress() }}%</span>
      </div>

      <div
        class="h-1.5 w-full overflow-hidden rounded-full bg-gray-200"
        role="progressbar"
        aria-label="Upload progress"
        [attr.aria-valuenow]="uploadService.progress()"
        aria-valuemin="0"
        aria-valuemax="100"
      >
        <div
          class="h-full rounded-full bg-blue-600 transition-all duration-200"
          [style.width.%]="uploadService.progress()"
        ></div>
      </div>
    </div>
  }

  <!-- Error Message -->
  @if (uploadService.error(); as error) {
    <div class="mt-3 flex items-center gap-2 rounded-lg border border-red-200 bg-red-50 p-3 text-xs text-red-700" role="alert">
      <svg class="h-4 w-4 shrink-0 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
      </svg>
      <span>{{ error }}</span>
    </div>
  }

  <!-- Upload Success Notice -->
  @if (preview(); as image) {
    <div class="mt-3 flex items-center justify-between rounded-lg border border-gray-200 bg-gray-50 p-3">
      <div class="flex items-center gap-2.5 overflow-hidden">
        <img
          [src]="image.previewUrl"
          alt="Uploaded preview"
          class="h-10 w-10 shrink-0 rounded-md object-cover border border-gray-200"
        />
        <div class="min-w-0">
          <p class="text-xs font-medium text-gray-900 truncate">
            {{ selectedFileName() || image.objectName }}
          </p>
          <span class="text-[11px] text-emerald-600 font-medium">Uploaded</span>
        </div>
      </div>

      <button
        type="button"
        (click)="clearPreview()"
        class="rounded p-1 text-gray-400 hover:text-gray-600"
        aria-label="Dismiss upload confirmation"
      >
        <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
          <path d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z" />
        </svg>
      </button>
    </div>
  }
</div>
